  <text x="480" y="432" font-size="10.5" font-weight="700" fill="#FFFFFF">Superficie (m2) ¤</text>
  <text x="660" y="432" font-size="10.5" font-weight="700" fill="#FFFFFF">Consumo (kWh/mes) ¤</text>
  <text x="860" y="432" font-size="10.5" font-weight="700" fill="#FFFFFF">Ahorro Estimado ¤</text>

  <rect x="190" y="440" width="820" height="24" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="200" y="456" font-size="10.5" fill="#1E293B">Planta Baja (Acceso y Logística) <tspan fill="#0284C7">¤</tspan></text>
  <text x="560" y="456" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">850 ¤</text>
  <text x="760" y="456" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">6420 ¤</text>
  <text x="960" y="456" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">14,5 % ¤</text>

  <rect x="190" y="464" width="820" height="24" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="200" y="480" font-size="10.5" fill="#1E293B">Planta 1 (CPD y Laboratorio) <tspan fill="#0284C7">¤</tspan></text>
  <text x="560" y="480" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">620 ¤</text>
  <text x="760" y="480" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">11850 ¤</text>
  <text x="960" y="480" font-family="monospace" font-size="10.5" fill="#1E293B" text-anchor="end">22,0 % ¤</text>

  <!-- Tab Stops with Leader Dots Preview -->
  <text x="190" y="514" font-size="12" font-weight="700" fill="#0369A1">4. ÍNDICE DE EQUIPOS REVISADOS (TABULACIONES CON RELLENO) <tspan fill="#0284C7" font-family="monospace">¶</tspan></text>
  <rect x="190" y="522" width="820" height="52" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="202" y="542" font-family="monospace" font-size="11" fill="#1E293B">Unidad Enfriadora RoofTop Carrier 40kW <tspan fill="#0284C7">······ → ······</tspan> Ing. Marta Salazar <tspan fill="#0284C7">······ → ······</tspan> Revisión Completada <tspan fill="#0284C7">¶</tspan></text>
  <text x="202" y="564" font-family="monospace" font-size="11" fill="#1E293B">Cuadro General de Baja Tensión CGBT-01 <tspan fill="#0284C7">······ → ······</tspan> Téc. Roberto Méndez <tspan fill="#0284C7">······ → ······</tspan> Pendiente Equilibrado <tspan fill="#0284C7">¶</tspan></text>

  <!-- Footer -->
  <line x1="190" y1="592" x2="1010" y2="592" stroke="#E2E8F0"/>
  <text x="190" y="610" font-family="monospace" font-size="10" fill="#64748B">Auditoría Energética Interna</text>
  <text x="1010" y="610" font-family="monospace" font-size="10" fill="#64748B" text-anchor="end">Página 1 de 2</text>
