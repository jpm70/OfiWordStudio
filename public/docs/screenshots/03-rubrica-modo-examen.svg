<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="540" fill="#0F172A"/>

  <!-- Card Container in Dark Mode -->
  <rect x="60" y="35" width="1080" height="470" rx="12" fill="#1E293B" stroke="#334155"/>

  <!-- Header -->
  <text x="90" y="75" font-size="12" fill="#94A3B8">Modo Examen · Evaluación de Memoria de Menús + Cronómetro MOS</text>
  <text x="90" y="102" font-size="20" font-weight="700" fill="#F8FAFC">Hoja de Instrucciones en Modo Examen (Tema Oscuro)</text>

  <!-- Timer + Exam Toggle -->
  <rect x="670" y="66" width="130" height="36" rx="8" fill="#090E1A" stroke="#334155"/>
  <text x="735" y="89" font-family="monospace" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">⏱ 14:25 ⏸</text>

  <rect x="815" y="66" width="295" height="36" rx="8" fill="#090E1A" stroke="#334155"/>
  <text x="895" y="89" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Modo Práctica Guiada</text>
  <rect x="975" y="70" width="130" height="28" rx="6" fill="#D97706"/>
  <text x="1040" y="89" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">🙈 Modo Examen</text>

  <!-- Exam Mode Banner -->
  <rect x="90" y="122" width="1020" height="42" rx="8" fill="#451A03" stroke="#92400E"/>
  <text x="110" y="148" font-size="12" font-weight="600" fill="#FDE68A">Modo Examen activo: Se han ocultado las rutas de la Cinta de Opciones, los atajos y las pistas de errores frecuentes.</text>
  <text x="1090" y="148" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="end" text-decoration="underline">Volver a Práctica Guiada</text>

  <!-- Table Header (Notice Ribbon Column is Hidden!) -->
  <rect x="90" y="182" width="1020" height="34" fill="#090E1A" stroke="#334155"/>
  <text x="110" y="204" font-size="12" font-weight="700" fill="#CBD5E1">Hecho</text>
  <text x="180" y="204" font-size="12" font-weight="700" fill="#CBD5E1">Categoría y Acción Requerida (Sin ayudas de Cinta de Opciones)</text>
  <text x="1090" y="204" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="end">Puntos</text>

  <!-- Row 1 -->
  <rect x="90" y="216" width="1020" height="68" fill="#064E3B" fill-opacity="0.35" stroke="#334155"/>
  <rect x="114" y="238" width="18" height="18" rx="4" fill="#0284C7"/>
  <text x="119" y="252" font-size="13" font-weight="700" fill="#FFFFFF">✓</text>
  <text x="180" y="242" font-size="12" font-weight="700" fill="#38BDF8">01. Portada y Secciones</text>
  <text x="180" y="264" font-size="13" fill="#94A3B8" text-decoration="line-through">Inserta una portada prediseñada y divide el documento en 3 secciones independientes.</text>
  <text x="1090" y="254" font-family="monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="end">+15</text>

  <!-- Row 2 -->
  <rect x="90" y="284" width="1020" height="68" fill="#1E293B" stroke="#334155"/>
  <rect x="114" y="306" width="18" height="18" rx="4" fill="#090E1A" stroke="#64748B" stroke-width="1.5"/>
  <text x="180" y="310" font-size="12" font-weight="700" fill="#38BDF8">02. Estilos y Lista Multinivel</text>
  <text x="180" y="332" font-size="13" fill="#F8FAFC">Aplica "Título 1" a los CAPÍTULOS y "Título 2" a los subapartados vinculados a lista multinivel.</text>
  <text x="1090" y="322" font-family="monospace" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">+20</text>

  <!-- Row 3 -->
  <rect x="90" y="352" width="1020" height="68" fill="#1E293B" stroke="#334155"/>
  <rect x="114" y="374" width="18" height="18" rx="4" fill="#090E1A" stroke="#64748B" stroke-width="1.5"/>
  <text x="180" y="378" font-size="12" font-weight="700" fill="#38BDF8">03. Encabezados Desvinculados</text>
  <text x="180" y="400" font-size="13" fill="#F8FAFC">Desactiva "Vincular al anterior" en la Sección 3, reinicia numeración en 1 e inserta campo StyleRef.</text>
  <text x="1090" y="390" font-family="monospace" font-size="14" font-weight="700" fill="#F8FAFC" text-anchor="end">+20</text>

  <!-- Footer Action -->
  <rect x="890" y="444" width="220" height="38" rx="8" fill="#0284C7"/>
  <text x="1000" y="468" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">🖨 Emitir Hoja de Calificación</text>
</svg>
