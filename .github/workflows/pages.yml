name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 ejecuta las pruebas .ts sin compilar; Bun instala con su lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias (lockfile exacto)
        run: bun install --frozen-lockfile
      - name: Pruebas del núcleo
        run: npm test
      - name: Tipos, web y versión offline
        run: npm run build
      - name: La web lleva CSP y no carga recursos de terceros
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          ! grep -nE '(src|href)="https?://' dist/index.html
          test -s dist/ofiword-studio.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ./dist

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
